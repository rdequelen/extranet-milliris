# Point d'entree de la configuration des services de l'application.
# Les dependances se configurent dans packages/.

parameters:
    # L'identite affichee dans l'en-tete n'est plus un parametre : le gabarit lit
    # l'utilisateur authentifie (`app.user`), pose par le pare-feu. Les anciens
    # `app.client_name` / `app.client_role` ont disparu avec le bloc factice.

    # Expediteur des courriels sortants (aujourd'hui : le lien de connexion).
    # Format RFC accepte : « Libelle <adresse> » ou juste « adresse ».
    app.mail_from: '%env(MAILER_FROM)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Deux scalaires que l'autowiring ne peut pas deviner (lus par
            # App\Security\LoginLinkSender).
            string $mailFrom: '%app.mail_from%'
            bool $debug: '%kernel.debug%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # Les entites Doctrine ne sont pas des services : elles se
            # construisent avec des scalaires et vivent dans l'EntityManager.
            - '../src/Entity/'
            # Objets de valeur et enums du catalogue de modules : ils se
            # construisent avec des scalaires, l'autoconfiguration n'a rien a
            # en faire. Seul ModuleRegistry est un vrai service.
            - '../src/Navigation/Module.php'
            - '../src/Navigation/ModuleFamily.php'
            - '../src/Navigation/ModuleStatus.php'
