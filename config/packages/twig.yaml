twig:
    file_name_pattern: '*.twig'

    globals:
        # Catalogue des modules : source unique pour la barre laterale, les tuiles
        # d'accueil et la page « a venir ». Un module qui arrive se declare dans
        # App\Navigation\ModuleRegistry et nulle part ailleurs.
        modules: '@App\Navigation\ModuleRegistry'

        # L'identite de l'en-tete n'est PAS une globale : le gabarit lit
        # `app.user` (App\Entity\User), pose par le pare-feu de securite.

when@test:
    twig:
        strict_variables: true
